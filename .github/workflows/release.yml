name: release

# Builds the sdist/wheel and attaches them to the GitHub Release for the
# pushed tag, and separately builds+pushes a Docker image to GHCR (GitHub
# Container Registry -- what actually populates the repo's "Packages" tab;
# GitHub has no native PyPI-style package type, so the sdist/wheel above
# are release assets, not a "package" in GitHub's own sense). Both jobs run
# on GitHub's own infrastructure specifically because the environment that
# built this repo's automation could reach api.github.com (creating the
# v0.1.0 release itself worked) but not uploads.github.com (the separate
# domain release-asset uploads go through), and had no `docker` binary at
# all to build/test an image locally -- see DECISIONS.md's packaging ADR.
# CI runners have neither restriction.

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.11

      - name: Build sdist and wheel
        run: uv build

      - name: Verify built artifacts
        run: |
          uv run --with twine twine check dist/*
          python3 -m venv /tmp/release_check_venv
          /tmp/release_check_venv/bin/pip install --quiet dist/*.whl
          /tmp/release_check_venv/bin/forge --version

      - name: Attach artifacts to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true

  build-and-push-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/forge
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify the pushed image actually runs
        run: |
          docker run --rm ghcr.io/${{ github.repository_owner }}/forge:latest --version
